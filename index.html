<style>
  :root{
    --bg:#0b0f14;
    --bg-accent:#12303a;
    --card:rgba(255,255,255,.06);
    --card-hover:rgba(255,255,255,.12);
    --border:rgba(255,255,255,.12);
    --text:#f2f5f7;
    --muted:#9aa7b2;
    --accent:#3ddc97;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 600px at 50% -10%, var(--bg-accent), transparent 70%),
      var(--bg);
    background-attachment:fixed;
    display:flex;
    justify-content:center;
    padding:56px 20px 72px;
  }
  .page{width:100%;max-width:520px;text-align:center}

  .avatar{
    width:112px;height:112px;border-radius:50%;
    object-fit:cover;display:block;margin:0 auto 18px;
    border:3px solid var(--border);
    background:var(--card);
    box-shadow:0 12px 40px rgba(0,0,0,.45);
  }
  h1{font-size:1.5rem;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
  .handle{color:var(--accent);font-weight:600;font-size:.95rem;margin:0 0 12px}
  .bio{color:var(--text);font-size:1rem;line-height:1.55;margin:0 auto 14px;max-width:420px}
  .facts{
    list-style:none;padding:0;margin:0 auto 28px;max-width:420px;
    display:flex;flex-direction:column;gap:6px;
    color:var(--muted);font-size:.94rem;line-height:1.5;
  }
  .facts li{display:flex;align-items:baseline;gap:10px;text-align:left}
  .facts .emoji{flex:none;width:1.3rem}

  .links{display:flex;flex-direction:column;gap:14px;margin-bottom:32px}
  .link{
    display:flex;align-items:center;gap:14px;
    padding:16px 18px;border-radius:16px;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);text-decoration:none;
    font-weight:600;font-size:1rem;
    backdrop-filter:blur(8px);
    transition:transform .16s ease, background .16s ease, border-color .16s ease;
  }
  .link:hover{background:var(--card-hover);border-color:var(--accent);transform:translateY(-2px)}
  .link:active{transform:translateY(0)}
  .link .emoji{font-size:1.2rem;width:1.5rem;flex:none}
  .link .txt{flex:1;text-align:left}
  .link .sub{display:block;font-weight:400;font-size:.8rem;color:var(--muted);margin-top:2px}
  .link.primary{background:var(--accent);color:#06231a;border-color:transparent}
  .link.primary .sub{color:rgba(6,35,26,.7)}
  .link.primary:hover{background:#54e9a8}

  .socials{display:flex;justify-content:center;gap:12px;margin-bottom:36px}
  .socials a{
    width:44px;height:44px;border-radius:50%;
    display:grid;place-items:center;
    background:var(--card);border:1px solid var(--border);
    color:var(--text);transition:background .16s ease,transform .16s ease;
  }
  .socials a:hover{background:var(--card-hover);transform:translateY(-2px)}
  .socials svg{width:20px;height:20px;fill:currentColor}

  footer{color:var(--muted);font-size:.78rem}
  footer a{color:var(--muted)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
